name: Release Module

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Get versionCode from module.prop
        id: versioncode
        run: |
          CODE=$(grep 'versionCode=' module/module.prop | cut -d'=' -f2)
          echo "CODE=$CODE" >> $GITHUB_OUTPUT
      
      - name: Create ZIP
        run: |
          cd module
          zip -r ../beszel-agent-magisk-${{ steps.version.outputs.VERSION }}.zip . -x "*.git*" -x "*.DS_Store"
          cd ..
      
      - name: Update update.json
        run: |
          cat > update.json << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "versionCode": ${{ steps.versioncode.outputs.CODE }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/beszel-agent-magisk-${{ steps.version.outputs.VERSION }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          }
          EOF
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            beszel-agent-magisk-*.zip
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}